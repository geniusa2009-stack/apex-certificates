# Local development only. Production: managed Postgres + secret manager / KMS, TLS-terminating proxy for verify.apex.org.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: apex
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on: [db]
    env_file: server/.env
    environment:
      DATABASE_URL: postgres://apex:${POSTGRES_PASSWORD}@db:5432/apex
    ports: ["127.0.0.1:8080:8080"]
volumes:
  pgdata: {}
